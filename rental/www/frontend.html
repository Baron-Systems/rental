<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/rental/frontend/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/rental/frontend/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/rental/frontend/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/rental/frontend/favicon-16.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>نظام الإيجار</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#012350" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نظام الإيجار" />
    <link rel="apple-touch-icon" href="/assets/rental/frontend/icons/apple-touch-icon.png" />
    <script>
      window.csrf_token = "{{ csrf_token }}";
    </script>
    {% for preload in preloads %}
    <link rel="modulepreload" href="{{ preload }}" />
    {% endfor %}
    {% for style in styles %}
    <link rel="stylesheet" href="{{ style }}" />
    {% endfor %}
  </head>
  <body>
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>
    {% for script in scripts %}
    {% if script.module %}
    <script type="module" crossorigin src="{{ script.src }}"></script>
    {% else %}
    <script src="{{ script.src }}"></script>
    {% endif %}
    {% endfor %}
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/" })
            .catch(function (err) {
              console.warn("Service worker registration failed:", err);
            });
        });
      }
    </script>
  </body>
</html>
