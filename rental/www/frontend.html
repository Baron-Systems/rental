<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام الإيجار</title>
    <script>
      window.csrf_token = "{{ csrf_token }}";
    </script>
    {% for preload in preloads %}
    <link rel="modulepreload" href="{{ preload }}" />
    {% endfor %}
    {% for style in styles %}
    <link rel="stylesheet" href="{{ style }}" />
    {% endfor %}
  </head>
  <body>
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>
    {% for script in scripts %}
    {% if script.module %}
    <script type="module" crossorigin src="{{ script.src }}"></script>
    {% else %}
    <script src="{{ script.src }}"></script>
    {% endif %}
    {% endfor %}
  </body>
</html>
